name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Unzip project
        run: |
          ZIP=$(ls vr_box_universal_launcher_v*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d work
          PROJ=$(dirname "$(find "$PWD/work" -maxdepth 2 -name project.godot | head -1)")
          echo "Project folder: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - name: Android SDK packages
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "platforms;android-33" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - name: Build plugin AAR
        run: |
          cd "$PROJ/Android/VRLauncherPlugin"
          gradle assembleRelease --no-daemon
          mkdir -p "$PROJ/addons/vr_launcher_export/bin"
          cp build/outputs/aar/*release*.aar "$PROJ/addons/vr_launcher_export/bin/VRLauncherPlugin.aar"
          ls -la "$PROJ/addons/vr_launcher_export/bin"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Android build template
        run: |
          T="$HOME/.local/share/godot/export_templates/4.3.stable"
          ls "$T" | head
          mkdir -p "$PROJ/android/build"
          unzip -q "$T/android_source.zip" -d "$PROJ/android/build"
          echo -n "4.3.stable" > "$PROJ/android/.build_version"
          touch "$PROJ/android/build/.gdignore"
      - name: Godot editor settings and debug keystore
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export preset
        run: |
          cat > "$PROJ/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/VRBoxLauncher.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="org.vrlauncher.box"
          package/name="VR Box Universal Launcher"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          EOF
      - name: Export APK
        run: |
          cd "$PROJ"
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/VRBoxLauncher.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: VRBoxLauncher-apk
          path: ${{ env.PROJ }}/build/*.apk
